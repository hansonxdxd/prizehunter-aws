[project]
name = "prizehunter-aws"
version = "0.1.0"
description = "Evidence-grounded competition decisions with Strands and pinned PrizeHunter Core."
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
  "prizehunter-core==0.1.0",
  "strands-agents==1.55.1",
  "beautifulsoup4>=4.13,<5",
  "pypdf>=6,<7",
  "botocore[crt]>=1.43.93,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.12"]

[project.scripts]
prizehunter = "prizehunter_aws.cli:main"

[tool.uv.sources]
prizehunter-core = { path = "packages/core" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prizehunter_aws"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/prizehunter_aws",
  "/packages/core/src/prizehunter_core",
  "/packages/core/README.md",
  "/packages/core/LICENSE",
  "/packages/core/pyproject.toml",
  "/tests",
  "/examples",
  "/scripts/live_validation.py",
  "/scripts/verify_manifest.py",
  "/pyproject.toml",
  "/uv.lock",
  "/README.md",
  "/LICENSE",
  "/THIRD_PARTY_NOTICES.md",
  "/SOURCE_MANIFEST.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires explicit paid Bedrock authorization and configuration"]

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["packages", "tests/core"]
