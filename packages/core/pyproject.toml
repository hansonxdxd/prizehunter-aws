[project]
name = "prizehunter-core"
version = "0.1.0"
description = "Provider-independent PrizeHunter evidence and decision contracts."
requires-python = ">=3.11,<3.14"
dependencies = ["pydantic>=2.11,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prizehunter_core"]
